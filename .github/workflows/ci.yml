name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: learnsmart_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        working-directory: Backend
        run: chmod +x mvnw

      - name: Run backend tests
        working-directory: Backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/learnsmart_test
          DB_USERNAME: test
          DB_PASSWORD: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_JWK_URI: ${{ secrets.JWT_JWK_URI }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRONT_URL: http://localhost:5173
        run: ./mvnw test

      - name: SonarCloud Scan (backend)
        working-directory: Backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DB_URL: jdbc:postgresql://localhost:5432/learnsmart_test
          DB_USERNAME: test
          DB_PASSWORD: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_JWK_URI: ${{ secrets.JWT_JWK_URI }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRONT_URL: http://localhost:5173
        run: ./mvnw sonar:sonar -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY_BACKEND }}

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Lint
        working-directory: Frontend
        run: npm run lint

      - name: Build
        working-directory: Frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: http://localhost:8081
        run: npm run build

      - name: SonarCloud Scan (frontend)
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: Frontend
          args: -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY_FRONTEND }}
