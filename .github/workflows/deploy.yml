name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -fsSL "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -X POST \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Vercel auto-deploys on push to main
        run: echo "Vercel deployment triggered automatically via GitHub integration."
